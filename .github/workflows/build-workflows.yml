name: 🏗️ Build Packages (Overwrite Release)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - srcpkgs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build📦 ${{ matrix.config.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64, host: x86_64, libc: glibc, platform: linux/amd64, test: 1 }

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20250616R1
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: ${{ matrix.config.arch }}
        XBPS_TARGET_ARCH: ${{ matrix.config.arch }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: 🧰 Prep container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          env -u XBPS_TARGET_ARCH xbps-install -Syu xbps
          env -u XBPS_TARGET_ARCH xbps-install -yu
          env -u XBPS_TARGET_ARCH xbps-install -y sudo bash curl grep jq zip unzip git github-cli xtools coreutils
          useradd -G xbuilder -M builder -s $(which bash)

      - name: 🔎 Checkout void-packages
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          path: void-packages

      - name: 🐛 Fix sourcepkg.sh
        working-directory: void-packages
        run: |
          sed -i 's@for var in $(awk .*;@for var in $(printenv | cut -d'"'"'='"'"' -f1);@' common/environment/setup/sourcepkg.sh

      - name: 🧩 Merge this repository into void-linux/void-packages
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git remote add -f $REPO_OWNER https://github.com/$REPO_OWNER/$REPO_NAME.git
          git merge --no-commit --strategy-option=theirs --allow-unrelated-histories -Xignore-space-change $REPO_OWNER/main
          mkdir -p hostdir/binpkgs

          gh release download --pattern "*${ARCH}*" --dir hostdir/binpkgs --repo $REPO_OWNER/$REPO_NAME || true

          if [ "$ARCH" = "x86_64" ]; then
            rm --force hostdir/binpkgs/*x86_64-musl*
          elif [ "$ARCH" = "x86_64-musl" ]; then
            rm --force hostdir/binpkgs/*x86_64.xbps
          fi
          rm --force hostdir/binpkgs/*.xbps.sig2

      - name: 📋 Identify changes to build
        working-directory: void-packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.config.arch }}
          SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          latest_name=$(gh release view --json tagName --jq '.tagName' --repo $REPO_OWNER/$REPO_NAME 2>/dev/null || echo "")
          if [ -z "$latest_name" ]; then
            latest_sha=$(git rev-list --max-parents=0 $REPO_OWNER/main)
          else
            latest_sha=$(git rev-list --max-count=1 "$latest_name")
          fi

          chown -R builder:builder .
          git diff-tree -r --no-renames --name-only --diff-filter=AM ${latest_sha} ${SHA} -- 'srcpkgs/**' \
          | cut -d/ -f 2 | uniq | xargs sudo -Eu builder ./xbps-src sort-dependencies | tee /tmp/templates

      - name: 🛠️ Setup void-packages
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          mkdir -p etc
          echo XBPS_BUILD_ENVIRONMENT=void-packages-ci >> etc/conf
          echo XBPS_ALLOW_RESTRICTED=yes >> etc/conf
          echo XBPS_CHROOT_CMD=uchroot >> etc/conf
          echo 'XBPS_REPOSITORY=$PWD/hostdir/binpkgs' >> etc/conf
          echo 'XBPS_DISTDIR=$PWD/hostdir/distfiles' >> etc/conf
          echo 'XBPS_MASTERDIR_PKGS="$PWD/hostdir/binpkgs"' >> etc/conf

      - name: 🔧 Prepare masterdir
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          chown -R builder:builder .
          yes | sudo -Eu builder ./xbps-src -m masterdir-${ARCH} -A ${ARCH} binary-bootstrap

      - name: ✅ Install gawk in chroot
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          MASTERDIR="masterdir-${ARCH}"

          if [ ! -d "$MASTERDIR" ]; then
            echo "❌ Error: $MASTERDIR does not exist"
            exit 1
          fi

          sudo mkdir -p "$MASTERDIR/etc/xbps.d"
          [ -d "/usr/share/xbps.d" ] && sudo cp /usr/share/xbps.d/*-repository-*.conf "$MASTERDIR/etc/xbps.d/" || { echo "❌ Not found /usr/share/xbps.d/"; exit 1; }

          sudo mount --bind /proc "$MASTERDIR/proc" || true
          sudo mount --bind /dev "$MASTERDIR/dev" || true
          sudo mount --bind /sys "$MASTERDIR/sys" || true

          yes | sudo chroot "$MASTERDIR" xbps-install -y gawk || { echo "❌ gawk installation failed"; sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" 2>/dev/null; exit 1; }
          { [ -f "$MASTERDIR/usr/bin/awk" ] || [ -f "$MASTERDIR/usr/bin/gawk" ]; } || { echo "❌ awk not found"; sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" 2>/dev/null; exit 1; }

          sudo umount "$MASTERDIR/proc" "$MASTERDIR/dev" "$MASTERDIR/sys" 2>/dev/null

      - name: 🗑️ Reset package cache & sync repos
        working-directory: void-packages
        run: sudo -Eu builder ./xbps-src clean || true

      - name: 📦 Build pkgs
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.config.arch }}
        run: |
          chown -R builder:builder .
          pkgs=$(cat /tmp/templates)
          for pkg in ${pkgs}; do
            echo "🏗️ Building $pkg for $ARCH..."
            sudo -Eu builder ./xbps-src pkg -j$(nproc) -m masterdir-${ARCH} -A ${ARCH} "${pkg}" || printf "Failed building ${pkg}!\n"
          done

      - name: 🧾 Clean & sign
        working-directory: void-packages/hostdir/binpkgs
        env:
          PRIVKEY: ${{ secrets.PRIV_KEY }}
          XBPS_PASSPHRASE: ${{ secrets.SIGN_PASS }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          sudo -Eu builder xbps-rindex --remove-obsoletes ${PWD}
          printf "%s\n" "${PRIVKEY}" > key.pem
          sudo -Eu builder xbps-rindex --privkey key.pem --sign --signedby "${REPO_NAME}-github-actions" --verbose ${PWD}
          sudo -Eu builder xbps-rindex --privkey key.pem --sign-pkg --verbose ${PWD}/*.xbps
          sudo -Eu builder rm -f key.pem
          sudo -Eu builder xbps-rindex --clean ${PWD}

      - name: 🔢 Checksum
        working-directory: void-packages/hostdir/binpkgs
        run: |
          rm -rf *.sha256sum *.sha512sum
          count=$(ls -1 *.xbps 2>/dev/null | wc -l)
          if [ "$count" != 0 ]; then
            for file in *.xbps; do
              sha256sum "${file}" | cut -d ' ' -f 1 > "${file}.sha256sum"
              sha512sum "${file}" | cut -d ' ' -f 1 > "${file}.sha512sum"
            done
          else
            echo "No packages found to checksum."
          fi

      - name: 💾 Fetch existing repo from Release
        working-directory: /tmp
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          set -e
          mkdir -p oldrepo
          cd oldrepo

          TAG="${ARCH}"
          url="https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases/tags/${TAG}"
          resp=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$url") || true
          code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')

          if [ "$code" != "200" ]; then
            echo "No existing release ${TAG} (HTTP ${code}), starting fresh."
            exit 0
          fi

          echo "$body" | jq -r '.assets[] | "\(.name)|\(.url)"' | while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            echo "Downloading $name"
            curl -sSL -o "$name" -H "Accept: application/octet-stream" -H "Authorization: Bearer ${GH_TOKEN}" "$url" || true
          done
          echo "Fetched $(ls -A 2>/dev/null | wc -l) files from release ${TAG}"

      - name: 📤 Upload to Release (.xbps + .sig2 + repodata)
        working-directory: void-packages/hostdir/binpkgs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          ARCH: ${{ matrix.config.arch }}
        run: |
          set -e
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"

          TAG="${ARCH}"
          API="https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}"
          UPLOADS="https://uploads.github.com/repos/${REPO_OWNER}/${REPO_NAME}"

          # Obtaining a release ID
          resp=$(curl -s -H "$AUTH" -H "$ACCEPT" "${API}/releases/tags/${TAG}")
          release_id=$(echo "$resp" | jq -r '.id // empty')

          if [ -z "$release_id" ]; then
            body=$(curl -s -X POST -H "$AUTH" -H "$ACCEPT" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"Binary repo for ${TAG}\"}" \
              "${API}/releases")
            release_id=$(echo "$body" | jq -r '.id')
          fi

          echo "Using release ID: $release_id"

          # We collect prefixes into a string (without arrays, so that it works in any shell)
          prefixes=""
          for file in *.xbps; do
            [ -f "$file" ] || continue
            pkg_prefix=$(echo "$file" | sed -E 's/^([^-]+).*/\1-/')
            if [ -n "$pkg_prefix" ]; then
              prefixes="$prefixes $pkg_prefix"
            fi
          done

          if [ -n "$prefixes" ]; then
            echo "Will clean old versions for prefixes:$prefixes"
          else
            echo "No .xbps files found. Nothing to upload."
            exit 0
          fi

          # Removing old assets by prefix
          assets=$(curl -s -H "$AUTH" -H "$ACCEPT" "${API}/releases/${release_id}" | jq -c '.assets[] | {id: .id, name: .name}')
          for asset in $assets; do
            asset_id=$(echo "$asset" | jq -r '.id')
            asset_name=$(echo "$asset" | jq -r '.name')

            matched=false
            for prefix in $prefixes; do
              if [[ "$asset_name" == "$prefix"* ]]; then
                matched=true
                break
              fi
            done

            if [ "$matched" = true ]; then
              echo "Deleting old asset: $asset_name (id=$asset_id)"
              curl -s -X DELETE -H "$AUTH" -H "$ACCEPT" "${API}/releases/assets/${asset_id}"
            fi
          done

          # Upload .xbps
          for file in *.xbps; do
            [ -f "$file" ] || continue
            filename="$file"
            upload_url="${UPLOADS}/releases/${release_id}/assets?name=${filename}"
            echo "Uploading $filename"
            curl -L -H "$AUTH" -H "Content-Type: application/octet-stream" --data-binary "@${filename}" "${upload_url}"
          done

          # Upload .sig2
          for file in *.sig2; do
            [ -f "$file" ] || continue
            filename="$file"
            upload_url="${UPLOADS}/releases/${release_id}/assets?name=${filename}"
            echo "Uploading $filename"
            curl -L -H "$AUTH" -H "Content-Type: application/octet-stream" --data-binary "@${filename}" "${upload_url}"
          done

          # Upload *-repodata
          for file in "${ARCH}-repodata"; do
            [ -f "$file" ] || continue
            filename="$file"
            upload_url="${UPLOADS}/releases/${release_id}/assets?name=${filename}"
            echo "Uploading $filename"
            curl -L -H "$AUTH" -H "Content-Type: application/octet-stream" --data-binary "@${filename}" "${upload_url}"
          done
